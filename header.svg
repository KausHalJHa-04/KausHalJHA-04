<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="55%" stop-color="#0d1224"/>
      <stop offset="100%" stop-color="#111834"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c8cff"/>
      <stop offset="55%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#7c8cff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7c8cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="260" rx="14" fill="url(#bg)"/>
  <rect width="900" height="260" rx="14" fill="url(#grid)"/>
  <rect width="900" height="260" rx="14" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="899" height="259" rx="14" fill="none" stroke="#1e2540" stroke-width="1"/>

  <!-- window chrome -->
  <rect x="0" y="0" width="900" height="38" rx="14" fill="#0f1428"/>
  <rect x="0" y="24" width="900" height="14" fill="#0f1428"/>
  <circle cx="26" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="19" r="6" fill="#febc2e"/>
  <circle cx="66" cy="19" r="6" fill="#28c840"/>
  <text x="450" y="24" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="12" fill="#5b6a94">kaushal-jha — profile.dev — 92x30</text>
  <line x1="0" y1="38" x2="900" y2="38" stroke="#1e2540" stroke-width="1"/>

  <!-- code lines -->
  <g font-family="'JetBrains Mono',Consolas,monospace" font-size="18">
    <text x="40" y="86" fill="#5b6a94">1</text>
    <text x="70" y="86" fill="#c47bff">const</text>
    <text x="138" y="86" fill="#eef1fb">developer</text>
    <text x="252" y="86" fill="#5b6a94">=</text>
    <text x="270" y="86" fill="#eef1fb">{</text>

    <text x="40" y="118" fill="#5b6a94">2</text>
    <text x="88" y="118" fill="#2dd4bf">name</text>
    <text x="140" y="118" fill="#5b6a94">:</text>
    <text x="158" y="118" fill="#f5a623">'Kaushal Kumar Jha'</text>
    <text x="390" y="118" fill="#5b6a94">,</text>

    <text x="40" y="150" fill="#5b6a94">3</text>
    <text x="88" y="150" fill="#2dd4bf">role</text>
    <text x="140" y="150" fill="#5b6a94">:</text>
    <text x="158" y="150" fill="#f5a623">'Full Stack Web Developer'</text>

    <text x="40" y="182" fill="#5b6a94">4</text>
    <text x="88" y="182" fill="#2dd4bf">stack</text>
    <text x="150" y="182" fill="#5b6a94">:</text>
    <text x="168" y="182" fill="#f5a623">'MERN'</text>
    <text x="234" y="182" fill="#5b6a94">,</text>
    <text x="88" y="182" fill="#2dd4bf" opacity="0"> </text>

    <text x="70" y="214" fill="#eef1fb">}</text>
    <rect x="88" y="200" width="10" height="18" fill="#7c8cff">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0" y="256" width="900" height="4" fill="url(#accentLine)"/>
</svg>
